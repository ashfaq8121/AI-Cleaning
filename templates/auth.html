<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Smart Data Analyzer — Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #070710;
  --surface: #0f0f1c;
  --card: #13131f;
  --border: #1e1e33;
  --primary: #6c63ff;
  --primary-glow: rgba(108,99,255,0.25);
  --secondary: #2dd4bf;
  --accent: #f59e0b;
  --text: #e8e8f0;
  --muted: #6b6b8a;
  --danger: #ef4444;
  --success: #10b981;
  --radius: 14px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Space Grotesk',sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}
/* Animated background mesh */
.bg-mesh{
  position:fixed;inset:0;z-index:0;
  background:
    radial-gradient(ellipse 70% 50% at 20% 40%, rgba(108,99,255,0.12) 0%, transparent 60%),
    radial-gradient(ellipse 50% 60% at 80% 60%, rgba(45,212,191,0.08) 0%, transparent 60%),
    radial-gradient(ellipse 40% 40% at 50% 10%, rgba(245,158,11,0.06) 0%, transparent 60%);
  animation: mesh 12s ease-in-out infinite alternate;
}
@keyframes mesh{
  0%{opacity:1;transform:scale(1)}
  100%{opacity:.8;transform:scale(1.05)}
}
.grid-lines{
  position:fixed;inset:0;z-index:0;
  background-image:
    linear-gradient(rgba(108,99,255,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(108,99,255,0.04) 1px, transparent 1px);
  background-size:60px 60px;
}
.orb{
  position:fixed;border-radius:50%;filter:blur(80px);z-index:0;
  animation:float 8s ease-in-out infinite;
}
.orb1{width:400px;height:400px;background:rgba(108,99,255,0.07);top:-100px;left:-100px;animation-delay:0s}
.orb2{width:300px;height:300px;background:rgba(45,212,191,0.05);bottom:-80px;right:-80px;animation-delay:3s}
@keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(20px,-20px)}}

.container{
  position:relative;z-index:1;
  width:100%;max-width:440px;
  padding:0 20px;
}
.brand{
  text-align:center;margin-bottom:36px;
  animation:fadeUp .6s ease both;
}
.brand-icon{
  width:56px;height:56px;border-radius:16px;
  background:linear-gradient(135deg,var(--primary),var(--secondary));
  display:flex;align-items:center;justify-content:center;
  font-size:26px;margin:0 auto 14px;
  box-shadow:0 0 30px var(--primary-glow);
}
.brand h1{font-size:22px;font-weight:700;letter-spacing:-0.5px}
.brand p{font-size:13px;color:var(--muted);margin-top:4px}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:32px;
  box-shadow:0 24px 80px rgba(0,0,0,0.5);
  animation:fadeUp .6s .1s ease both;
}
/* Tabs */
.tabs{display:flex;background:var(--surface);border-radius:10px;padding:4px;margin-bottom:28px}
.tab-btn{
  flex:1;padding:9px;border-radius:7px;border:none;cursor:pointer;
  font-family:inherit;font-size:14px;font-weight:500;
  transition:all .2s;background:transparent;color:var(--muted);
}
.tab-btn.active{
  background:var(--primary);color:#fff;
  box-shadow:0 4px 20px var(--primary-glow);
}
/* Form */
.form-group{margin-bottom:18px}
label{display:block;font-size:12px;font-weight:500;color:var(--muted);
      text-transform:uppercase;letter-spacing:.8px;margin-bottom:7px}
input{
  width:100%;padding:13px 16px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:10px;
  color:var(--text);font-family:inherit;font-size:14px;
  transition:all .2s;outline:none;
}
input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-glow)}
input::placeholder{color:var(--muted)}

.btn{
  width:100%;padding:14px;border-radius:10px;border:none;cursor:pointer;
  font-family:inherit;font-size:15px;font-weight:600;
  background:linear-gradient(135deg,var(--primary),#8b5cf6);
  color:#fff;transition:all .2s;
  box-shadow:0 8px 24px var(--primary-glow);
  position:relative;overflow:hidden;
}
.btn:hover{transform:translateY(-1px);box-shadow:0 12px 30px var(--primary-glow)}
.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
.btn-shine{
  position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.1),transparent);
  transform:translateX(-100%);transition:transform .4s;
}
.btn:hover .btn-shine{transform:translateX(100%)}

.alert{
  padding:12px 16px;border-radius:10px;font-size:13px;margin-bottom:18px;
  display:none;animation:fadeIn .3s ease;
}
.alert.error{background:rgba(239,68,68,0.12);border:1px solid rgba(239,68,68,0.3);color:#fca5a5}
.alert.success{background:rgba(16,185,129,0.12);border:1px solid rgba(16,185,129,0.3);color:#6ee7b7}

.panel{display:none}
.panel.active{display:block}

@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

.spinner{
  width:16px;height:16px;border:2px solid rgba(255,255,255,0.3);
  border-top-color:#fff;border-radius:50%;
  animation:spin .6s linear infinite;display:inline-block;vertical-align:middle;margin-right:8px;
}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="bg-mesh"></div>
<div class="grid-lines"></div>
<div class="orb orb1"></div>
<div class="orb orb2"></div>

<div class="container">
  <div class="brand">
    <div class="brand-icon">⚡</div>
    <h1>AI Smart Data Analyzer</h1>
    <p>Upload. Clean. Visualize. Understand.</p>
  </div>

  <div class="card">
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('login')">Sign In</button>
      <button class="tab-btn" onclick="switchTab('signup')">Create Account</button>
    </div>

    <div id="alert" class="alert"></div>

    <!-- Login -->
    <div class="panel active" id="panel-login">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="login-email" placeholder="you@example.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password">
      </div>
      <button class="btn" id="login-btn" onclick="doLogin()">
        <div class="btn-shine"></div>
        Sign In
      </button>
    </div>

    <!-- Signup -->
    <div class="panel" id="panel-signup">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="signup-name" placeholder="Your name">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="signup-email" placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="signup-password" placeholder="Min. 6 characters">
      </div>
      <button class="btn" id="signup-btn" onclick="doSignup()">
        <div class="btn-shine"></div>
        Create Account
      </button>
    </div>
  </div>
</div>

<script>
let activeTab = 'login';

function switchTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.tab-btn').forEach((b,i) => {
    b.classList.toggle('active', (tab==='login' ? i===0 : i===1));
  });
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById(`panel-${tab}`).classList.add('active');
  clearAlert();
}

function showAlert(msg, type='error') {
  const el = document.getElementById('alert');
  el.className = `alert ${type}`;
  el.textContent = msg;
  el.style.display = 'block';
}
function clearAlert() {
  document.getElementById('alert').style.display = 'none';
}

function setLoading(btnId, loading) {
  const btn = document.getElementById(btnId);
  btn.disabled = loading;
  btn.innerHTML = loading
    ? '<div class="btn-shine"></div><span class="spinner"></span>Please wait...'
    : `<div class="btn-shine"></div>${btnId==='login-btn' ? 'Sign In' : 'Create Account'}`;
}

async function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  if (!email || !password) { showAlert('Please fill in all fields'); return; }
  setLoading('login-btn', true);
  try {
    const res = await fetch('/api/login', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({email, password})
    });
    const data = await res.json();
    if (data.error) { showAlert(data.error); }
    else { showAlert('Welcome back! Redirecting...', 'success'); setTimeout(() => location.href='/dashboard', 800); }
  } catch(e) { showAlert('Network error. Try again.'); }
  finally { setLoading('login-btn', false); }
}

async function doSignup() {
  const name = document.getElementById('signup-name').value.trim();
  const email = document.getElementById('signup-email').value.trim();
  const password = document.getElementById('signup-password').value;
  if (!name || !email || !password) { showAlert('Please fill in all fields'); return; }
  setLoading('signup-btn', true);
  try {
    const res = await fetch('/api/signup', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({name, email, password})
    });
    const data = await res.json();
    if (data.error) { showAlert(data.error); }
    else { showAlert(`Welcome, ${data.name}! Redirecting...`, 'success'); setTimeout(() => location.href='/dashboard', 800); }
  } catch(e) { showAlert('Network error. Try again.'); }
  finally { setLoading('signup-btn', false); }
}

// Enter key support
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    activeTab === 'login' ? doLogin() : doSignup();
  }
});
</script>
</body>
</html>
